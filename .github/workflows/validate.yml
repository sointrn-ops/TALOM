name: Validate TALOM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/admin-and-site-bugs]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check cart.js
          node --check admin.js
          node --check tests/smoke-check.mjs
      - name: Run static smoke checks
        run: node tests/smoke-check.mjs
